[imports]
PIL = ["Pillow"]
yaml = ["PyYAML"]
cv2 = ["opencv-python", "opencv-python-headless"]
sklearn = ["scikit-learn"]
bs4 = ["beautifulsoup4"]
dateutil = ["python-dateutil"]
dotenv = ["python-dotenv"]
serial = ["pyserial"]
Crypto = ["pycryptodome"]
fitz = ["PyMuPDF"]

# These hints apply only with a matching project host or --application NAME.
[applications]
freecad = ["FreeCAD", "FreeCADGui", "Part", "Sketcher"]
kicad = ["pcbnew"]
blender = ["bpy"]
